name: DENUE Full Analysis

on:
  workflow_dispatch:
    inputs:
      skip_moran:
        description: 'Skip Moran spatial autocorrelation for a faster run'
        type: boolean
        default: true
  push:
    paths:
      - 'data/denue/raw/Growa_DENUE_Sinaloa_Historico_2010_2026.zip'

jobs:
  analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - name: Test
        run: pytest -q
      - name: Run verified EDA pipeline
        shell: bash
        run: |
          EXTRA=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.skip_moran }}" = "true" ]; then EXTRA="--skip-moran"; fi
          python scripts/denue/run_pipeline.py --through all $EXTRA
      - name: Generate Mazatlan and state reports
        run: python scripts/denue/report.py --municipality 012
      - name: Run exploratory predictive models
        run: python scripts/denue/model.py
      - uses: actions/upload-artifact@v4
        with:
          name: denue-full-analysis
          path: |
            var/denue/reports/
            var/denue/processed/eda_core/
            var/denue/processed/spatial_eda/polycentricity.parquet
            var/denue/processed/spatial_eda/global_moran.parquet
            var/denue/processed/feature_store/
            var/denue/processed/models/
          if-no-files-found: warn
          retention-days: 14
