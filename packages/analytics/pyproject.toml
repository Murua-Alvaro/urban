[project]
name = "urban-analytics"
version = "0.1.0"
description = "Econometrics and spatial data-science core for Urban"
requires-python = ">=3.12"
dependencies = [
  "numpy>=2.1",
  "pandas>=2.2",
  "scipy>=1.14",
  "statsmodels>=0.14",
  "linearmodels>=6.1",
  "scikit-learn>=1.5",
  "geopandas>=1.0",
  "libpysal>=4.12",
  "esda>=2.6",
  "spreg>=1.8",
  "shapely>=2.0",
  "sqlalchemy>=2.0.35",
  "psycopg[binary]>=3.2"
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.7"]
