[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "urban-denue"
version = "0.1.0"
description = "Reproducible DENUE historical ingestion, cleaning and EDA for Urban"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2",
  "numpy>=1.26",
  "pyarrow>=17",
  "requests>=2.32",
  "pydantic>=2.9",
  "pyyaml>=6.0",
  "scipy>=1.13",
  "statsmodels>=0.14",
  "matplotlib>=3.9",
  "geopandas>=1.0",
  "shapely>=2.0",
  "libpysal>=4.12",
  "esda>=2.6",
  "scikit-learn>=1.5",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.7", "jupyter>=1.1", "nbconvert>=7.16"]

[tool.hatch.build.targets.wheel]
packages = ["src/urban_denue"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
