[project]
name = "urban-api"
version = "0.1.0"
description = "Urban data ingestion and analytics API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.12",
  "sqlalchemy>=2.0.35",
  "psycopg[binary]>=3.2",
  "pydantic-settings>=2.5",
  "pandas>=2.2",
  "pyarrow>=17",
  "openpyxl>=3.1",
  "geopandas>=1.0",
  "shapely>=2.0",
  "pyogrio>=0.10"
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "httpx>=0.27", "ruff>=0.7"]

[tool.ruff]
line-length = 100
